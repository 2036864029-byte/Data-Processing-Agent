# 单机多机构同构（宪法 VI / G10）：同一份 compose，把 *_URL 指向外部实例即可迁移多机。
name: dataagent

x-dataagent-env: &dataagent-env
  DATAAGENT_POSTGRES_URL: postgresql+psycopg://dataagent:dataagent@postgres:5432/dataagent
  DATAAGENT_REDIS_URL: redis://redis:6379/0
  DATAAGENT_OBJECT_STORE_BACKEND: s3
  DATAAGENT_S3_ENDPOINT: http://minio:9000
  DATAAGENT_S3_ACCESS_KEY: dataagent
  DATAAGENT_S3_SECRET_KEY: dataagent-secret
  DATAAGENT_S3_BUCKET: dataagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dataagent
      POSTGRES_PASSWORD: dataagent
      POSTGRES_DB: dataagent
    # 专用宿主端口：本机 5432 已被 Langfuse 占用，招标项目用 5433
    ports:
      - "127.0.0.1:15432:5432"
    mem_limit: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 专用宿主端口：本机 6379 已被 Langfuse 占用，招标项目用 6380
    ports:
      - "127.0.0.1:16379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # 固定标签（避免 latest 漂移；本机缓存可达的版本）
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dataagent
      MINIO_ROOT_PASSWORD: dataagent-secret
    # 专用宿主端口：9000 已被 Langfuse ClickHouse 占用，Milvus MinIO 用 9003/9004
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    mem_limit: 512m
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["dataagent", "up", "--host", "0.0.0.0", "--port", "8080", "--role", "api"]
    environment: *dataagent-env
    # 可用 .env 覆盖宿主端口，避免与其他项目抢 8080
    ports:
      - "${DATAAGENT_API_PORT:-8080}:8080"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["dataagent", "up", "--role", "worker"]
    environment: *dataagent-env
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
